version: '3.8'

# volumes,networks 的 前缀
name: example

# 需要的服务
services:
  # 应用服务
  app:
    image: eclipse-temurin:21-jre-jammy
    container_name: example-app
    ports:
      - '8080:8080'
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS="-Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      #      # 阿里云 服务配置
      #      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:?未配置ALIBABA_CLOUD_ACCESS_KEY_ID环境变量}
      #      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?未配置ALIBABA_CLOUD_ACCESS_KEY_SECRET环境变量}
      #      # 邮件配置
      #      - MAIL_HOST=${MAIL_HOST:?未配置MAIL_HOST环境变量}
      #      - MAIL_USERNAME=${MAIL_USERNAME:?未配置MAIL_USERNAME环境变量}
      #      - MAIL_PASSWORD=${MAIL_PASSWORD:?未配置MAIL_PASSWORD环境变量}
      # 依赖容器配置
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
    #      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-123456}
    volumes:
      - ./example-server.jar:/app/app.jar:ro
      - ./logs:/app/logs
    working_dir: /app # 指定工作目录
    command: java -jar app.jar --spring.profiles.active=prod

    deploy: # 资源限制（生产环境必配）
      resources:
        limits:
          memory: 768M # 限制最大内存
        reservations:
          memory: 256M # 保留最小内存
    depends_on:
      - mysql
    #      - redis
    #      - rabbitmq
    networks:
      - example

  # mysql数据库
  mysql:
    image: mysql:8.0
    container_name: example-mysql
    ports:
      - '3306:3306'
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-123456}
    command:
      - '--default-time-zone=+08:00'
    volumes:
      - mysql-data:/var/lib/mysql # 挂载mysql数据目录
      - ./sql:/docker-entrypoint-initdb.d # 挂载mysql初始化脚本目录
    networks:
      - example

  # redis缓存
  redis:
    image: redis:8.0
    container_name: example-redis
    ports:
      - '6379:6379'
    environment:
      - TZ=Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis-data:/data # 挂载redis数据目录
    networks:
      - example
#
#    # 消息队列
#    rabbitmq:
#        image: rabbitmq:3.8-management
#        container_name: example-rabbitmq
#        hostname: example-rabbitmq # 该容器的主机名
#        ports:
#            - '5672:5672' # mq端口,用于收发消息
#            - '15672:15672' # web控制台页面
#        environment:
#            - TZ=Asia/Shanghai
#            - RABBITMQ_DEFAULT_USER=root
#            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-123456}
#        volumes:
#            - rabbitmq-data:/var/lib/rabbitmq # 挂载rabbitmq数据目录
#            - rabbitmq-plugin:/plugins # 挂载rabbitmq插件目录
#        networks:
#            - example

volumes:
  mysql-data:
  redis-data:
#    rabbitmq-data:
#    rabbitmq-plugin:

networks:
  example:
