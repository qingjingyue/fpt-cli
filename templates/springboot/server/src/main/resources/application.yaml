# 服务配置
server:
  # 运行端口
  port: 8080
  servlet:
    # 编码
    encoding:
      # 开启编码
      enabled: true
      # 强制使用charset
      force: true
      charset: UTF-8

# spring配置
spring:
  application:
    name: example
  # 环境配置
  profiles:
    active: dev
  # 开启虚拟线程
  threads:
    virtual:
      enabled: true
  # mysql配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${example.mysql.host}:3306/example?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: ${example.mysql.password}
  data:
    redis: # redis配置
      host: ${example.redis.host}
      port: 6379
      password: ${example.redis.password}
      database: 0
  #  # rabbitmq配置
  #  rabbitmq:
  #    host: ${example.rabbitmq.host}
  #    port: 5672
  #    virtual-host: /
  #    username: root
  #    password: ${example.rabbitmq.password}
  # 邮件配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com} # 邮件服务器,例如  smtp.qq.com
    username: ${MAIL_USERNAME:123@qq.com} # 邮箱
    password: ${MAIL_PASSWORD:123} # 授权码
    ssl:
      enabled: true

# mybatis-plus配置
mybatis-plus:
  # xml映射文件路径
  mapper-locations: classpath:mapper/**/*.xml
  # 类型别名包
  type-aliases-package: com.example.domain.po
  configuration:
    # 日志实现类
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰 -> 下划线
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略, 自动递增
      id-type: auto

# knife4j的增强配置，不需要增强可以不配
knife4j:
  # 开启增强
  enable: true
  # 当前是否是生产环境
  production: ${example.knife4j.production}
  setting:
    language: zh_cn # 语言

# 日志配置
logging:
  level: # 日志级别
    com.example: debug
  file: # 日志目录位置
    path: logs
  pattern: # 日期格式
    dateformat: yyyy-MM-dd HH:mm:ss

# 行为验证码配置， 详细请看 cloud.tianai.captcha.autoconfiguration.ImageCaptchaProperties 类
captcha:
  # 如果项目中使用到了redis，滑块验证码会自动把验证码数据存到redis中， 这里配置redis的key的前缀,默认是captcha:slider
  prefix: captcha
  # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
  expire:
    # 默认缓存时间 2分钟
    default: 10000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 20000
  # 使用加载系统自带的资源， 默认是 false(这里系统的默认资源包含 滑动验证码模板/旋转验证码模板,如果想使用系统的模板，这里设置为true)
  init-default-resource: true
  # 缓存控制， 默认为false不开启
  local-cache-enabled: true
  # 缓存开启后，验证码会提前缓存一些生成好的验证数据， 默认是20
  local-cache-size: 20
  # 缓存开启后，缓存拉取失败后等待时间 默认是 5秒钟
  local-cache-wait-time: 5000
  # 缓存开启后，缓存检查间隔 默认是2秒钟
  local-cache-period: 2000
  # 缓存开启后，忽略的字段，默认是 ""(不忽略任何字段)
  local-cache-ignored-cache-fields: ""
  # 配置字体包，供文字点选验证码使用,可以配置多个，不配置使用默认的字体
  #  font-path:
  #    - classpath:font/SimHei.ttf
  secondary:
    # 二次验证， 默认false 不开启
    enabled: true
    # 二次验证过期时间， 默认 2分钟
    expire: 120000
    # 二次验证缓存key前缀，默认是 captcha:secondary
    keyPrefix: "captcha:secondary"





# 项目配置
example:
  # JWT 令牌配置
  jwt:
    token-name: token
    secret-key: secretKey
    ttl: 86400    # 有效时间, 单位: 秒
  # 阿里云 服务配置
  aliyun:
    accessKeyId: ${ALIBABA_CLOUD_ACCESS_KEY_ID:123}
    accessKeySecret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:123}
  login:
    way: # 登录方式
      account: true    # 账号密码登录
      phone: true    # 手机号登录
      email: true    # 邮箱登录
    verify-code: # 验证码配置
      ttl: 5    # 有效时间, 单位: 分钟
