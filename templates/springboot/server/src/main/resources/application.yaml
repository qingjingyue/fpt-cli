# 服务配置
server:
  # 运行端口
  port: 8080
  servlet:
    # 编码
    encoding:
      # 开启编码
      enabled: true
      # 强制使用charset
      force: true
      charset: UTF-8

# spring配置
spring:
  application:
    name: example
  # 环境配置
  profiles:
    active: dev
  # mysql配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${example.mysql.host}/${example.mysql.database}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: ${example.mysql.username}
    password: ${example.mysql.password}
  data:
    # redis配置
    redis:
      host: ${example.redis.host}
      password: ${example.redis.password}
      port: ${example.redis.port}
  # rabbitmq配置
  rabbitmq:
    host: ${example.rabbitmq.host}
    port: ${example.rabbitmq.port}
    virtual-host: ${example.rabbitmq.virtual-host}
    username: ${example.rabbitmq.username}
    password: ${example.rabbitmq.password}


# mybatis-plus配置
mybatis-plus:
  # xml映射文件路径
  mapper-locations: classpath:mapper/**/*.xml
  # 类型别名包
  type-aliases-package: com.example.domain.po
  configuration:
    # 日志实现类
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰 -> 下划线
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略, 自动递增
      id-type: auto

# knife4j的增强配置，不需要增强可以不配
knife4j:
  # 开启增强
  enable: true
  # 当前是否是生产环境
  production: ${example.knife4j.production}
  setting:
    language: zh_cn # 语言

# 日志配置
logging:
  level: # 日志级别
    com.example: debug
  file: # 日志目录位置
    path: logs
  pattern: # 日期格式
    dateformat: yyyy-MM-dd HH:mm:ss

# 项目配置
example:
  jwt:
    token-name: token
    secret-key: secretKey
    ttl: 86400
